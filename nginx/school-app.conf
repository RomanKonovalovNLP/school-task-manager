server {
    listen 80;
    server_name schooltakt.ru www.schooltakt.ru;

    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name schooltakt.ru www.schooltakt.ru;

    # SSL сертификаты (будут добавлены certbot)
    ssl_certificate /etc/letsencrypt/live/schooltakt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schooltakt.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Frontend
    location / {
        root /var/www/school-task-manager/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API - убираем /api из пути
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket для уведомлений
    location /socket.io {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Статические файлы (uploads)
    location /uploads {
        alias /var/www/school-task-manager/backend/uploads;
    }
}
