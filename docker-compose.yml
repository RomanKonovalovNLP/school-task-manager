services:
  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: plantakt_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?укажите POSTGRES_PASSWORD в файле .env рядом с docker-compose.yml}
      POSTGRES_DB: ${POSTGRES_DB:-school_tasks}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plantakt_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?укажите POSTGRES_PASSWORD в файле .env}
      DATABASE_NAME: ${POSTGRES_DB:-school_tasks}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-https://plantakt.ru}
      NODE_ENV: production
      # Ключ первичной установки супер-админа (в репозиторий не попадает)
      SUPER_ADMIN_SETUP_KEY: ${SUPER_ADMIN_SETUP_KEY:?укажите SUPER_ADMIN_SETUP_KEY в файле .env}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-https://plantakt.ru/api}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-https://plantakt.ru}
    container_name: plantakt_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:80"

  # Nginx reverse proxy с SSL
  nginx:
    image: nginx:alpine
    container_name: plantakt_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot для SSL
  certbot:
    image: certbot/certbot
    container_name: plantakt_certbot
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  uploads:
  certbot_data:
  certbot_certs:
